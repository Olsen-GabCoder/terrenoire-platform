# Configuration Render (référence)
# Pour un service déjà créé à la main, recopiez ces commandes dans
# Dashboard > votre service backend > Settings > Build & Deploy.
#
# IMPORTANT : la base de données n'est PAS joignable pendant la phase de build
# sur Render (réseau privé indisponible). Les commandes qui touchent la base
# (migrate, create_admin_user) doivent donc être lancées au démarrage, pas au build.

services:
  - type: web
    name: maison-edition-api
    runtime: python
    rootDir: backend

    buildCommand: >
      pip install -r requirements-render.txt
      && python manage.py collectstatic --noinput

    startCommand: >
      python manage.py migrate --noinput
      && python manage.py create_admin_user --no-update
      && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # À définir dans le dashboard (secrets) :
      # CREATE_ADMIN_EMAIL, CREATE_ADMIN_PASSWORD, SECRET_KEY, DATABASE_URL,
      # ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS, FRONTEND_URL, BAMBOO_WEBHOOK_SECRET,
      # BREVO_API_KEY (e-mails : Render bloque le SMTP sur les offres gratuites), DEFAULT_FROM_EMAIL, etc.
