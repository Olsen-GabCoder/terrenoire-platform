name: terrenoire-editions
region: fra

# ============================================================
# BACKEND — Django + DRF + gunicorn
# ============================================================
services:
  - name: backend
    git:
      repo_clone_url: https://github.com/Olsen-GabCoder/terrenoire-platform.git
      branch: main
    source_dir: backend
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080

    build_command: |
      pip install -r requirements-prod.txt
      python manage.py collectstatic --noinput

    run_command: |
      python manage.py migrate --noinput && \
      python manage.py create_admin_user --no-update && \
      gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 2

    health_check:
      http_path: /api/config/delivery/
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    envs:
      - key: PYTHON_VERSION
        value: "3.12.7"
        scope: BUILD_TIME
      - key: SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DEBUG
        value: "False"
        scope: RUN_AND_BUILD_TIME
      - key: ALLOWED_HOSTS
        scope: RUN_TIME
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: "${db.DATABASE_URL}"
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
      - key: CSRF_TRUSTED_ORIGINS
        scope: RUN_TIME
      - key: FRONTEND_URL
        scope: RUN_TIME
      - key: CLOUDINARY_CLOUD_NAME
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: CLOUDINARY_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: CLOUDINARY_API_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: BAMBOO_PAY_API_URL
        scope: RUN_TIME
        value: "https://client-v2.bamboopay-ga.com"
      - key: BAMBOO_PAY_MERCHANT_ID
        scope: RUN_TIME
        type: SECRET
      - key: BAMBOO_PAY_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: BAMBOO_PAY_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: BAMBOO_CALLBACK_URL
        scope: RUN_TIME
      # Jeton secret ajouté automatiquement à l'URL de callback Bamboo (?token=...)
      - key: BAMBOO_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_HOST
        scope: RUN_TIME
        value: "smtp-relay.brevo.com"
      - key: EMAIL_PORT
        scope: RUN_TIME
        value: "587"
      - key: EMAIL_USE_TLS
        scope: RUN_TIME
        value: "True"
      - key: EMAIL_HOST_USER
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_HOST_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DEFAULT_FROM_EMAIL
        scope: RUN_TIME
        value: "olsenkampala@gmail.com"
      - key: ADMIN_EMAIL
        scope: RUN_TIME
        value: "olsenkampala@gmail.com"
      - key: CREATE_ADMIN_EMAIL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: CREATE_ADMIN_PASSWORD
        scope: RUN_AND_BUILD_TIME
        type: SECRET

# ============================================================
# FRONTEND — React + Vite static build
# ============================================================
static_sites:
  - name: frontend
    git:
      repo_clone_url: https://github.com/Olsen-GabCoder/terrenoire-platform.git
      branch: main
    source_dir: frontend

    build_command: |
      npm install && npm run build

    output_dir: dist

    catchall_document: index.html

    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME

# ============================================================
# BASE DE DONNEES — PostgreSQL Managed
# ============================================================
databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
    production: false
